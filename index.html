<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Mesajil Hnos - Seguimiento de guías</title>
<style>
:root{--bg:#f3f5fa;--fg:#14203d;--card:#fff;--mut:#5d6882;--line:#d9dfec;--ac:#1F5FBF;--ok:#14804a;--wa:#b45309;--er:#b42318;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--fg:#e8ecf7;--card:#19223a;--mut:#9aa6c3;--line:#2a3555;--ac:#6ea0ff;--ok:#4cc38a;--wa:#f0b35a;--er:#ff7a70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1524;--fg:#e8ecf7;--card:#19223a;--mut:#9aa6c3;--line:#2a3555;--ac:#6ea0ff;--ok:#4cc38a;--wa:#f0b35a;--er:#ff7a70;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 Arial,sans-serif;padding-bottom:76px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#fff}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:3px solid #1F5FBF}
header img{height:36px;max-width:50%}header .who{margin-left:auto;text-align:right;font-size:12px;color:#14203d}header a{color:#1F5FBF}
main{padding:14px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
h2{margin:4px 0 10px;font-size:18px}h3{margin:0 0 6px;font-size:15px}
button,select,input{font:inherit;border-radius:10px;border:1px solid var(--line);padding:10px;background:var(--card);color:var(--fg);width:100%;box-sizing:border-box}
button{background:var(--ac);color:#fff;border:0;font-weight:bold;margin-top:8px}button.s{background:var(--card);color:var(--fg);border:1px solid var(--line)}button.d{background:var(--er)}button.k{background:var(--ok)}
.big{font-size:54px;font-weight:bold;text-align:center;color:var(--ac);line-height:1}.mut{color:var(--mut);font-size:13px}
.chip{display:inline-block;background:var(--line);border-radius:20px;padding:2px 9px;margin:2px;font-size:13px}
.tl{border-left:3px solid var(--ac);padding-left:10px;margin:0 0 10px 6px}.warn{color:var(--wa);font-weight:bold}
#reader{width:100%;border-radius:10px;overflow:hidden;margin-top:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #d9dfec;padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:12px 2px;font-size:12px;color:#5d6882;cursor:pointer}nav a.on{color:#1F5FBF;font-weight:bold;border-top:3px solid #1F5FBF;margin-top:-1px}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#14203d;color:#fff;padding:8px 14px;border-radius:20px;display:none;z-index:20;max-width:90%}
a.map{color:var(--ac)}
</style></head><body>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwspPe7_Dp89NYR3nF9fC3RE7jhmVoRlP82cbTGV479yqgHqfYxHUbuBslKTLGJXhlb/exec";
const CLIENT_ID="393956940776-q9fntrsg04ea8fjf4qnc7g02spodv8l0.apps.googleusercontent.com";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S=null,tab="esc",qr=null,pos="",lastC="",lastT=0,tok=sessionStorage.getItem("mhtok")||"";
const sn=id=>(S.suc.find(x=>x.id===id)||{}).n||"";
const vn=id=>(S.veh.find(x=>x.id===id)||{}).n||"";
const fmt=t=>new Date(t).toLocaleString("es-PE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const toast=m=>{const t=$("#t");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2600)};
if(navigator.geolocation)navigator.geolocation.watchPosition(p=>pos=p.coords.latitude.toFixed(6)+", "+p.coords.longitude.toFixed(6),()=>{},{enableHighAccuracy:true});
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),120);navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
async function api(op,d){const r=await fetch(API_URL,{method:"POST",body:JSON.stringify(Object.assign({token:tok,op,p:pos},d||{}))});const j=await r.json();if(j.err==="auth")throw new Error("auth");if(j.err)throw new Error(j.err);return j}
function fail(e){e.message==="auth"?login("Sesión vencida. Ingresa de nuevo."):e.message==="noautorizado"?login("Tu correo no está autorizado. Pide acceso al administrador."):(toast(e.message),S&&render())}
async function run(op,d){try{S=await api(op,d);render()}catch(e){fail(e)}}
function login(msg){stopCam();S=null;tok="";sessionStorage.removeItem("mhtok");$("#who").textContent="";$("#nv").innerHTML="";
$("#m").innerHTML=`<div class="card"><h2>Ingresar</h2><p class="mut">Usa la cuenta de Google que el administrador autorizó.</p><div id="gb"></div><p class="warn">${esc(msg||"")}</p></div>`;
const go=()=>{google.accounts.id.initialize({client_id:CLIENT_ID,callback:r=>{tok=r.credential;sessionStorage.setItem("mhtok",tok);boot()}});google.accounts.id.renderButton($("#gb"),{theme:"outline",size:"large",locale:"es"})};
window.google&&google.accounts?go():setTimeout(go,1200)}
async function boot(){$("#m").innerHTML='<p class="mut">Cargando…</p>';try{S=await api("load");render()}catch(e){fail(e)}}
function nav(){const a=[["esc","Escanear"],["con","Consultar"],["don","Dónde están"]];if(S.me.r==="Administrador")a.push(["adm","Admin"]);
$("#nv").innerHTML=a.map(x=>`<a class="${tab===x[0]?"on":""}" onclick="go('${x[0]}')">${x[1]}</a>`).join("")}
function go(t){stopCam();tab=t;render()}
function render(){if(!S)return;const u=S.me;
$("#who").innerHTML=`<b>${esc(u.n)}</b><br>${u.r}${u.s?" · "+esc(sn(u.s)):""} · <a href="#" onclick="login();return false">Salir</a>`;nav();
({esc:vEsc,con:vCon,don:vDon,adm:vAdm})[tab]($("#m"))}
const myL=()=>S.lotes.find(l=>l.e===S.me.e);
const loteG=l=>S.movs.filter(m=>m.l===l.id);
function vEsc(m){const u=S.me;
if(u.r==="Administrador"){m.innerHTML=`<div class="card">El administrador consulta y edita. Los escaneos los hacen los usuarios Motorizado y Tienda.</div>`;return}
if(u.r==="Motorizado"&&!S.v){m.innerHTML=`<div class="card"><h2>Iniciar jornada</h2><p class="mut">Elige tu vehículo de hoy. Se usará en todos tus escaneos.</p><select id="vh">${S.veh.map(v=>`<option value="${v.id}">${esc(v.n)}</option>`).join("")}</select><button onclick="run('jornada',{v:$('#vh').value})">Iniciar jornada</button></div>`;return}
const ub=u.r==="Motorizado"?"Vehículo: "+vn(S.v):"Sucursal: "+sn(u.s),l=myL();
if(!l){m.innerHTML=`<div class="card"><h3>${esc(ub)}</h3><p class="mut">Abre un lote, escanea las guías una tras otra y ciérralo al terminar.</p><button onclick="run('newLote')">Nuevo lote</button>${u.r==="Motorizado"?`<button class="s" onclick="S.v='';render()">Cambiar vehículo</button>`:""}</div>`;return}
m.innerHTML=`<div class="card"><h3>${esc(ub)}</h3><div class="big" id="cnt">0</div><div class="mut" style="text-align:center">guías escaneadas en este lote</div>
<button id="cb" onclick="cam()">Activar cámara</button><button class="s" onclick="$('#ph').click()">Escanear con foto</button><input id="ph" type="file" accept="image/*" capture="environment" hidden onchange="foto(this)"><div id="reader"></div>
<div style="display:flex;gap:8px;margin-top:8px"><input id="mg" placeholder="O escribe la guía"><button style="width:90px;margin:0" onclick="add($('#mg').value);$('#mg').value=''">Agregar</button></div></div>
<div class="card"><div id="chips"></div><button class="k" onclick="close_()">Cerrar lote</button></div>`;upd()}
function upd(){const l=myL();if(!l||!$("#cnt"))return;const g=loteG(l);$("#cnt").textContent=g.length;$("#chips").innerHTML=g.slice().reverse().map(x=>`<span class="chip">${esc(x.g)}</span>`).join("")||'<span class="mut">Aún no hay guías.</span>'}
function add(g){g=String(g||"").trim();const l=myL();if(!g||!l)return;
if(S.movs.some(x=>x.l===l.id&&x.g===g)){toast("Ya escaneada en este lote: "+g);return}
const u=S.me,mv={id:"t"+Date.now(),g,t:Date.now(),e:u.e,n:u.n,r:u.r,l:l.id,ub:u.r==="Motorizado"?vn(S.v):sn(u.s),p:pos?pos.split(", ").map(Number):null};
S.movs.push(mv);beep();upd();
api("scan",{l:l.id,g}).catch(e=>{S.movs=S.movs.filter(x=>x!==mv);upd();fail(e)})}
async function cam(){if(qr){stopCam();return}
if(!window.Html5Qrcode){toast("Lector no disponible. Escribe la guía.");return}
qr=new Html5Qrcode("reader");try{await qr.start({facingMode:"environment"},{fps:10,qrbox:{width:230,height:230}},t=>{const n=Date.now();if(t===lastC&&n-lastT<2500)return;lastC=t;lastT=n;add(t)},()=>{});$("#cb").textContent="Apagar cámara"}catch(e){qr=null;toast("No se pudo abrir la cámara ("+((e&&e.name)||e)+"). Revisa el permiso o usa Escanear con foto.")}}
function stopCam(){if(qr){const q=qr;qr=null;q.stop().then(()=>q.clear()).catch(()=>{});const b=$("#cb");if(b)b.textContent="Activar cámara"}}
async function foto(i){const f=i.files[0];i.value="";if(!f)return;if(!window.Html5Qrcode){toast("Lector no disponible");return}try{const q=new Html5Qrcode("reader");const t=await q.scanFile(f,false);add(t);try{q.clear()}catch(e){}}catch(e){toast("No se leyó ningún QR. Acércate e inténtalo de nuevo.")}}
function close_(){const l=myL(),n=loteG(l).length;if(!n){toast("El lote no tiene guías");return}
if(confirm("Vas a cerrar el lote con "+n+" guías. ¿Confirmas?")){stopCam();run("close",{l:l.id})}}
function card(x,adm){return`<div class="tl"><b>${fmt(x.t)}</b> · ${esc(x.n)} <span class="chip">${x.r}</span><br>${x.r==="Motorizado"?"En movilidad":"En tienda"}: ${esc(x.ub)}${x.p?` · <a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${x.p[0]},${x.p[1]}">Ver ubicación</a>`:""}${adm&&x.id.length>3?` · <a href="#" class="map" onclick="delM('${x.id}');return false">Eliminar</a>`:""}</div>`}
function delM(id){if(confirm("¿Eliminar este registro?"))run("delMov",{id})}
function vCon(m){m.innerHTML=`<div class="card"><h2>Consultar guía</h2><input id="q" placeholder="Número de guía" oninput="rq()" value="${esc(window._q||"")}"></div><div id="res"></div>`;rq()}
function rq(){const q=($("#q").value||"").trim();window._q=q;const r=$("#res");if(!q){r.innerHTML='<p class="mut">Escribe un número de guía para ver quién la tuvo y a qué hora.</p>';return}
const by={};S.movs.filter(x=>x.g.includes(q)).sort((a,b)=>a.t-b.t).forEach(x=>(by[x.g]=by[x.g]||[]).push(x));const k=Object.keys(by);
r.innerHTML=k.length?k.map(g=>`<div class="card"><h3>Guía ${esc(g)}</h3>${by[g].map(x=>card(x,S.me.r==="Administrador")).join("")}</div>`).join(""):'<p class="mut">No hay registros para esa guía.</p>'}
function vDon(m){const last={};S.movs.forEach(x=>{if(!last[x.g]||x.t>last[x.g].t)last[x.g]=x});const a=Object.values(last).sort((x,y)=>y.t-x.t);
m.innerHTML=`<h2>Dónde está cada guía</h2>`+(a.map(x=>{const h=Math.round((Date.now()-x.t)/36e5),w=x.r==="Motorizado"&&h>24;return`<div class="card"><b>${esc(x.g)}</b> <span class="chip">${x.r==="Motorizado"?"En movilidad":"En tienda"}</span><br>${esc(x.ub)} · ${esc(x.n)}<br><span class="mut">${fmt(x.t)}</span> ${w?`<span class="warn">· ${h} h sin movimiento</span>`:""}</div>`}).join("")||'<p class="mut">Todavía no hay guías registradas.</p>')}
function vAdm(m){const R=["Motorizado","Tienda","Administrador"];
m.innerHTML=`<h2>Administración</h2><div class="card"><h3>Lotes abiertos (${S.lotes.length})</h3>${S.lotes.map(l=>`<div>${fmt(l.t)} · ${esc(l.n)} · ${S.movs.filter(x=>x.l===l.id).length} guías</div>`).join("")||'<span class="mut">Ninguno.</span>'}</div>
<div class="card"><h3>Usuarios</h3>${S.users.map((u,i)=>`<div style="margin:8px 0"><b>${esc(u.n)}</b> <span class="mut">${esc(u.e)}</span><div style="display:flex;gap:6px;margin-top:4px"><select onchange="setR(${i},this.value)">${R.map(r=>`<option${r===u.r?" selected":""}>${r}</option>`).join("")}</select><button class="d" style="width:80px;margin:0" onclick="delU(${i})">Quitar</button></div></div>`).join("")}
<input id="ue" placeholder="Correo Gmail" style="margin-top:8px"><input id="un" placeholder="Nombre" style="margin-top:6px"><select id="ur" style="margin-top:6px">${R.map(r=>`<option>${r}</option>`).join("")}</select><select id="us" style="margin-top:6px"><option value="">Sin sucursal</option>${S.suc.map(s=>`<option value="${s.id}">${esc(s.n)}</option>`).join("")}</select><button onclick="addU()">Agregar usuario</button></div>
<div class="card"><h3>Vehículos</h3>${S.veh.map(v=>`<span class="chip">${esc(v.n)} <a href="#" onclick="if(confirm('¿Quitar?'))run('delVeh',{id:'${v.id}'});return false">✕</a></span>`).join("")}<input id="nv2" placeholder="Nuevo vehículo" style="margin-top:8px"><button class="s" onclick="addV()">Agregar vehículo</button></div>
<div class="card"><h3>Sucursales</h3>${S.suc.map(s=>`<span class="chip">${esc(s.n)} <a href="#" onclick="if(confirm('¿Quitar?'))run('delSuc',{id:'${s.id}'});return false">✕</a></span>`).join("")}<input id="ns" placeholder="Nueva sucursal" style="margin-top:8px"><button class="s" onclick="addS()">Agregar sucursal</button></div>
<div class="card"><button class="d" onclick="if(confirm('¿Borrar todas las guías, lotes y jornadas?'))run('clearRecs')">Borrar guías y lotes</button></div>`}
function setR(i,r){const u=S.users[i];run("setUser",{e:u.e,n:u.n,r,s:u.s})}
function delU(i){const u=S.users[i];if(confirm("¿Quitar a "+u.n+"?"))run("delUser",{e:u.e})}
function addU(){run("setUser",{e:$("#ue").value,n:$("#un").value.trim(),r:$("#ur").value,s:$("#us").value})}
function addV(){const n=$("#nv2").value.trim();if(n)run("addVeh",{n})}
function addS(){const n=$("#ns").value.trim();if(n)run("addSuc",{n})}
window.addEventListener("load",()=>tok?boot():login());
</script></body></html>
